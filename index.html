<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#D23A05">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Gramme">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Gramme</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Big+Shoulders+Display:wght@700;800;900&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Gramme : identité sportive. Chiffres de poids très grands en capitales étroites,
   orange haute visibilité comme seul accent, trait oblique (la « slash ») répété sur titres et repères. */
:root{
  --paper:#E9EEF2; --card:#FFFFFF; --ink:#0E1A24; --mute:#52606C; --line:#CFD8DF;
  --sig:#0B7380; --acc:#D23A05; --on-acc:#FFFFFF;
  --ok:#1F7A45; --warn:#A85A00; --shade:rgba(10,20,28,.55);
  --c0:#3B5BA9; --c1:#7B4FA3; --c2:#8A6A3C; --c3:#D9A21B; --c4:#3E9A52;
  --c5:#C0407A; --c6:#2E8B7A; --c7:#2A9DC4; --c8:#86A62B; --c9:#6F7F8C;
  --display:'Big Shoulders Display','Arial Narrow',Impact,sans-serif;
  --body:'Barlow',system-ui,-apple-system,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0A1218; --card:#131F29; --ink:#ECF2F6; --mute:#9AAAB6; --line:#26363F;
    --sig:#4FD1D9; --acc:#FF6A2B; --on-acc:#1A0A02;
    --ok:#6CCB92; --warn:#F0A94A; --shade:rgba(0,0,0,.7);
    --c0:#7C98DA; --c1:#B08ADB; --c2:#C9A068; --c3:#F2C14E; --c4:#6FCB86;
    --c5:#E57AA9; --c6:#5CC4B0; --c7:#66C3E8; --c8:#B7D45A; --c9:#A3B0BA;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0A1218; --card:#131F29; --ink:#ECF2F6; --mute:#9AAAB6; --line:#26363F;
  --sig:#4FD1D9; --acc:#FF6A2B; --on-acc:#1A0A02;
  --ok:#6CCB92; --warn:#F0A94A; --shade:rgba(0,0,0,.7);
  --c0:#7C98DA; --c1:#B08ADB; --c2:#C9A068; --c3:#F2C14E; --c4:#6FCB86;
  --c5:#E57AA9; --c6:#5CC4B0; --c7:#66C3E8; --c8:#B7D45A; --c9:#A3B0BA;
  color-scheme:dark;
}
[hidden]{display:none !important}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:500 16px/1.45 var(--body);padding-bottom:calc(76px + env(safe-area-inset-bottom))}
body.lock{overflow:hidden}
h1,h2,h3{margin:0;font-family:var(--display);font-weight:800;text-transform:uppercase;text-wrap:balance}
h1{font-size:44px;line-height:.95;letter-spacing:.005em;font-weight:900}
h2{font-size:26px;line-height:1;letter-spacing:.02em}
h3{font-size:20px;line-height:1.05;letter-spacing:.02em}
p{margin:0}
a{color:inherit}
button{font:inherit;color:inherit}
.shell{max-width:720px;margin:0 auto;padding:0 16px}
.top{display:flex;align-items:center;gap:10px;padding:calc(14px + env(safe-area-inset-top)) 0 8px}
.logo{flex:none;width:40px;height:40px;display:block}
.top .btn{margin-left:auto}
.auth{max-width:420px;margin:28px auto 0}
.auth h1{margin-bottom:10px}
.brand{font:900 32px/1 var(--display);letter-spacing:.04em;text-transform:uppercase}
.tag{color:var(--mute);font-size:13px;font-weight:600}
.slash{display:inline-block;flex:none;width:7px;height:24px;background:var(--acc);transform:skewX(-16deg);border-radius:1px}
.nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:20}
.nav a{flex:1;text-align:center;text-decoration:none;padding:15px 0 13px;font:800 19px/1 var(--display);letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
.nav a[aria-current="page"]{color:var(--ink);box-shadow:inset 0 4px 0 var(--acc)}
.head h1::before{content:'';display:inline-block;width:9px;height:.8em;margin-right:12px;background:var(--acc);transform:skewX(-16deg);vertical-align:-.04em}
.head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:14px 0 14px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:9px 16px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);font-weight:600;font-size:15px;cursor:pointer;text-decoration:none}
.btn:hover{border-color:var(--mute)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--on-acc)}
.btn.sm{min-height:36px;padding:5px 11px;font-size:14px}
.btn.ghost{background:transparent}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.danger{color:var(--acc);border-color:var(--acc);background:transparent}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
input,select,textarea{font:inherit;color:inherit;background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:9px 12px;min-height:44px;width:100%}
textarea{min-height:84px;resize:vertical}
label.f{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600;color:var(--mute)}
label.f input,label.f select,label.f textarea{font-weight:400;color:var(--ink);font-size:16px}
.form{display:flex;flex-direction:column;gap:12px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:4px}
.actions .grow{flex:1}
.mute{color:var(--mute)}
.small{font-size:13px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
.sec{margin-top:26px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.cards{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.hcard{display:block;text-decoration:none;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
.hcard:hover{border-color:var(--mute)}
.hcard .t{display:flex;align-items:center;gap:10px}
.hcard h3{font-size:28px;font-weight:900}
.hcard .l{margin-top:6px;display:flex;gap:14px;flex-wrap:wrap;font-size:14px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chip{display:inline-flex;align-items:center;min-height:32px;padding:3px 11px;border:1px solid var(--line);border-radius:99px;background:var(--card);font-size:14px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip.static{cursor:default;min-height:26px;font-size:13px}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tile{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:8px 6px;text-align:center}
.tile b{display:block;font:800 32px/1 var(--display)}
.tile span{font-size:12px;color:var(--mute)}
.viz{width:100%;height:auto;display:block;margin-top:10px}
.viz text{fill:var(--mute);font:11px var(--mono)}
.drop{border:1.5px dashed var(--mute);border-radius:12px;padding:18px 16px;display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.plates{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.plate{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;text-align:left;cursor:pointer;width:100%}
.plate.open{border-style:dashed;border-color:var(--mute);cursor:default}
.plate .who{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.plate .who b{font:800 22px var(--display);letter-spacing:.04em;text-transform:uppercase}
.plate .big{font:900 64px/.9 var(--display);letter-spacing:-.01em;margin-top:6px;font-variant-numeric:tabular-nums}
.plate .big small{font-size:28px;font-weight:800;color:var(--acc);margin-left:5px;letter-spacing:.02em}
.plate .sub{display:flex;gap:12px;flex-wrap:wrap;margin-top:6px;font-size:13px;color:var(--mute)}
.bar{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--line);margin-top:10px}
.bar i{display:block;min-width:2px}
.pill{display:inline-block;margin-top:8px;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;border:1px solid currentColor}
.pill.ok{color:var(--ok)} .pill.warn{color:var(--warn)}
.dot{display:inline-block;width:10px;height:10px;border-radius:3px;flex:none}
.group{margin-top:14px}
.group-h{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:3px solid var(--ink)}
.group-h h3{flex:1;text-transform:uppercase;letter-spacing:.04em}
.row{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line)}
.row .chk{flex:none;display:flex;align-items:center;justify-content:center;width:44px;height:44px;margin:-6px 0 -6px -10px}
.row input[type=checkbox]{width:22px;height:22px;min-height:0;accent-color:var(--sig)}
.row .rt{flex:1;min-width:0;text-align:left;background:none;border:0;padding:4px 0;cursor:pointer;min-height:44px}
.row .rn{display:block;font-weight:500;overflow-wrap:anywhere}
.row .rm{display:block;font-size:13px;color:var(--mute)}
.row.done .rn{text-decoration:line-through;color:var(--mute)}
.row select{width:auto;max-width:42%;min-height:40px;padding:6px 8px;font-size:14px}
.qty{font:500 13px var(--mono);color:var(--acc);margin-left:6px}
.empty{padding:26px 16px;text-align:center}
.empty h2{margin-bottom:8px}
.empty .actions{justify-content:center;margin-top:14px}
.search{margin-bottom:6px}
.back-link{display:inline-block;margin-top:12px;font-size:14px;color:var(--mute);text-decoration:none}
.bars{display:flex;flex-direction:column;gap:12px}
.bars .b{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:end}
.bars .track{grid-column:1/-1;height:12px;background:var(--line);border-radius:6px;overflow:hidden}
.bars .track i{display:block;height:100%;background:var(--sig);border-radius:6px}
.back{position:fixed;inset:0;background:var(--shade);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.sheet{background:var(--card);width:100%;max-width:560px;max-height:90%;overflow:auto;border-radius:16px 16px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom))}
.sheet-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.sheet-h .x{width:44px;height:44px;border:0;background:none;font-size:28px;line-height:1;cursor:pointer;color:var(--mute)}
.pick .row{padding:4px 0}
.pick .add{flex:none}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom));background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:10px;font-size:14px;max-width:90%;z-index:80;display:none}
#toast.on{display:block}
.banner{margin-top:8px;padding:10px 12px;border-radius:8px;border:1px solid var(--warn);color:var(--warn);font-size:14px}
body.ro .act{display:none !important}
@media (max-width:420px){
  .tiles{grid-template-columns:repeat(2,1fr)}
  .plate .big{font-size:58px}
  h1{font-size:40px}
}
@media (prefers-reduced-motion: reduce){*{scroll-behavior:auto !important;transition:none !important;animation:none !important}}
</style>
</head>
<body>
<div class="shell">
  <header class="top">
    <svg class="logo" viewBox="0 0 40 40" role="img" aria-label="Gramme">
      <rect width="40" height="40" rx="10" fill="var(--acc)"/>
      <circle cx="20" cy="10.5" r="3.6" fill="none" stroke="var(--on-acc)" stroke-width="2.6"/>
      <path d="M12.2 33.5 14.6 16.6h10.8l2.4 16.9z" fill="var(--on-acc)"/>
      <path d="M15.6 27.6 19 22.6l2.3 3.1 1.6-2 2.7 3.9" fill="none" stroke="var(--acc)" stroke-width="1.9" stroke-linejoin="round" stroke-linecap="round"/>
    </svg>
    <span class="brand">Gramme</span>
    <span class="tag">sorties et poids du sac</span>
    <button class="btn sm ghost" id="acct" data-act="account" hidden>Compte</button>
  </header>
  <div id="ro-note"></div>
  <main id="app" aria-live="polite"></main>
</div>
<nav class="nav" aria-label="Sections">
  <a href="#sorties" data-tab="sorties">Sorties</a>
  <a href="#materiel" data-tab="materiel">Matériel</a>
  <a href="#sacs" data-tab="sacs">Sacs</a>
  <a href="#bilan" data-tab="bilan">Bilan</a>
</nav>
<div id="toast" role="status"></div>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
(function(){
'use strict';

/* ---------- constantes ---------- */
var CATS=['Abri','Couchage','Sac à dos','Cuisine','Eau et nourriture','Vêtements','Hygiène et santé','Électronique','Navigation et sécurité','Divers'];
var KINDS=[['carried','Dans le sac'],['worn','Porté sur soi'],['consumable','Consommable']];
var SEED=[
  ['Tente 2 places',1450,0,'carried'],['Tapis de sol',480,1,'carried'],['Sac de couchage 3 saisons',900,1,'carried'],
  ['Sac à dos 50 L',1500,2,'carried'],['Réchaud',90,3,'carried'],['Popote titane',110,3,'carried'],['Cartouche de gaz 230 g',360,3,'consumable'],
  ['Gourde souple 1 L (vide)',40,4,'carried'],['Eau, 1 litre',1000,4,'consumable'],['Repas lyophilisé',140,4,'consumable'],['Barres de céréales',50,4,'consumable'],
  ['Veste imperméable',340,5,'carried'],['Polaire',320,5,'carried'],['Chaussures de randonnée',1000,5,'worn'],['Bâtons de marche (paire)',480,5,'carried'],
  ['Trousse de secours',220,6,'carried'],['Crème solaire',90,6,'carried'],['Lampe frontale',85,7,'carried'],['Batterie externe',280,7,'carried'],
  ['Carte papier',60,8,'carried'],['Couteau',60,8,'carried'],['Montre GPS',45,7,'worn']
];

/* ---------- état ---------- */
var db=null, canWrite=true;
var state={gear:{},bags:{},hikes:{},ready:{gear:false,hikes:false},slow:false,auth:'boot',signupDone:false,loginEmail:'',filter:'all',q:''};
var inflight={};
var pickCtx=null; /* {hikeId|bagId,q} quand la feuille d'ajout est ouverte */

/* ---------- utilitaires ---------- */
function $(s,r){return (r||document).querySelector(s)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function uid(){return Math.random().toString(36).slice(2,8)+Date.now().toString(36).slice(-4)}
function num(v){var n=parseFloat(String(v==null?'':v).replace(',','.'));return isFinite(n)?n:null}
function fmt(n,d){return Number(n).toLocaleString('fr-FR',{minimumFractionDigits:d,maximumFractionDigits:d})}
function fmtW(g){g=g||0;return g<1000?fmt(Math.round(g),0)+' g':fmt(g/1000,g>=10000?1:2)+' kg'}
function fmtDate(iso){if(!iso)return '';var d=new Date(iso+'T12:00:00');return isNaN(d)?iso:d.toLocaleDateString('fr-FR',{day:'numeric',month:'short',year:'numeric'})}
function fmtDur(min){if(min==null)return '–';var h=Math.floor(min/60),m=Math.round(min%60);if(m===60){h++;m=0}return h+' h '+(m<10?'0':'')+m}
function today(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function ci(cat){var i=CATS.indexOf(cat);return i<0?9:i}
function kindLabel(k){for(var i=0;i<KINDS.length;i++)if(KINDS[i][0]===k)return KINDS[i][1];return KINDS[0][1]}
var toastT=null;
function toast(msg){var t=$('#toast');t.textContent=msg;t.className='on';clearTimeout(toastT);toastT=setTimeout(function(){t.className=''},4200)}
function errMsg(e){
  var c=e&&e.code,m=String(e&&e.message||'');
  if(!navigator.onLine||/fetch|network/i.test(m))return 'Hors ligne : modification impossible pour le moment.';
  if(c==='quota_exceeded')return 'Espace plein : supprime des éléments avant d\'en ajouter.';
  if(c==='42501'||c==='PGRST301')return 'Accès refusé. Ton adresse n\'est peut-être pas autorisée.';
  return 'Enregistrement impossible pour le moment. Réessaie dans un instant.';
}

/* ---------- écriture (une à la fois par document) ---------- */
var queues={};
function enqueue(path,fn){
  inflight[path]=(inflight[path]||0)+1;
  var p=(queues[path]||Promise.resolve()).then(fn).catch(function(e){toast(errMsg(e))}).then(function(){
    setTimeout(function(){inflight[path]=Math.max(0,(inflight[path]||1)-1)},1200);
  });
  queues[path]=p;return p;
}
function saveHike(h,keys){
  if(!db)return;
  var data={};keys.forEach(function(k){data[k]=h[k]===undefined?null:h[k]});
  enqueue('hikes/'+h.id,function(){return db.doc('hikes/'+h.id).update(data)});
}
function mutateHike(id,fn,keys){
  var cur=state.hikes[id];if(!cur||!canWrite)return;
  var h=structuredClone(cur);fn(h);state.hikes[id]=h;render();refreshPick();saveHike(h,keys);
}
function meMail(){return (userEmail||'').toLowerCase()}
function isOwner(h){return !h.owner||h.owner===meMail()}
function saveGear(g){
  if(!db)return;var d={name:g.name,g:g.g,cat:g.cat,kind:g.kind,owner:g.owner||meMail()};
  enqueue('gear/'+g.id,function(){return db.doc('gear/'+g.id).set(d)});
}

function saveBag(b){
  if(!db)return;var d={type:'bag',name:b.name,note:b.note||'',items:b.items||[],owner:b.owner||meMail()};
  enqueue('gear/'+b.id,function(){return db.doc('gear/'+b.id).set(d)});
}
function mutateBag(id,fn){
  var cur=state.bags[id];if(!cur||!canWrite)return;
  var b=structuredClone(cur);fn(b);state.bags[id]=b;render();refreshPick();saveBag(b);
}
function bagStats(b){
  var st={base:0,conso:0,worn:0,pack:0,n:0,byCat:{}};
  (b.items||[]).forEach(function(it){
    var g=state.gear[it.gid];if(!g)return;var w=(g.g||0)*(it.qty||1);
    if(g.kind==='worn')st.worn+=w;
    else{if(g.kind==='consumable')st.conso+=w;else st.base+=w;st.byCat[g.cat]=(st.byCat[g.cat]||0)+w}
    st.n++;
  });
  st.pack=st.base+st.conso;return st;
}
function addToBag(bid,gid){
  mutateBag(bid,function(b){
    var ex=b.items.filter(function(i){return i.gid===gid})[0];
    if(ex)ex.qty=(ex.qty||1)+1;else b.items.push({gid:gid,qty:1});
  });
}

/* ---------- calculs ---------- */
function compute(h){
  var people=h.people||[],items=h.items||[];
  function mk(){return {pack:0,base:0,conso:0,worn:0,byCat:{},n:0,done:0}}
  var per={};people.forEach(function(p){per[p.id]=mk()});
  var none=mk();
  items.forEach(function(i){
    var w=(i.g||0)*(i.qty||1);
    var b=(i.who&&per[i.who])?per[i.who]:none;
    if(i.kind==='worn'){b.worn+=w}
    else{b.pack+=w;if(i.kind==='consumable')b.conso+=w;else b.base+=w;b.byCat[i.cat]=(b.byCat[i.cat]||0)+w}
    b.n++;if(i.packed)b.done++;
  });
  var total=none.pack,n=none.n,done=none.done;
  people.forEach(function(p){total+=per[p.id].pack;n+=per[p.id].n;done+=per[p.id].done});
  return {per:per,none:none,total:total,n:n,done:done};
}
function avgKg(people){
  var s=0,c=0;people.forEach(function(p){if(p.kg){s+=p.kg;c++}});return c?s/c:70;
}
function balance(h,resetAll){
  var people=h.people;if(people.length<2)return false;
  if(resetAll)h.items.forEach(function(i){if(i.kind!=='worn')i.who=''});
  var avg=avgKg(people),cap={},load={};
  people.forEach(function(p){cap[p.id]=p.kg||avg;load[p.id]=0});
  h.items.forEach(function(i){if(i.kind!=='worn'&&i.who&&load[i.who]!==undefined)load[i.who]+=(i.g||0)*(i.qty||1)});
  var todo=[],keep=[];
  h.items.forEach(function(i){
    if(i.kind!=='worn'&&!i.who){for(var k=0;k<(i.qty||1);k++){var u=Object.assign({},i);u.qty=1;u.id=uid();todo.push(u)}}
    else keep.push(i);
  });
  if(!todo.length)return false;
  todo.sort(function(a,b){return (b.g||0)-(a.g||0)});
  todo.forEach(function(u){
    var best=null,bs=Infinity;
    people.forEach(function(p){var s=(load[p.id]+(u.g||0))/cap[p.id];if(s<bs){bs=s;best=p}});
    u.who=best.id;load[best.id]+=(u.g||0);
  });
  todo.forEach(function(u){
    var ex=null;
    for(var j=0;j<keep.length;j++){var m=keep[j];
      if(m.gearId===u.gearId&&m.name===u.name&&m.g===u.g&&m.who===u.who&&m.kind===u.kind&&m.cat===u.cat&&!m.packed===!u.packed){ex=m;break}}
    if(ex)ex.qty=(ex.qty||1)+1;else keep.push(u);
  });
  h.items=keep;return true;
}

/* ---------- GPX ---------- */
function hav(a,b){
  var R=6371000,r=Math.PI/180,dLat=(b.lat-a.lat)*r,dLon=(b.lon-a.lon)*r;
  var x=Math.sin(dLat/2)*Math.sin(dLat/2)+Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(dLon/2)*Math.sin(dLon/2);
  return 2*R*Math.asin(Math.min(1,Math.sqrt(x)));
}
function parseGpx(text){
  var doc=new DOMParser().parseFromString(text,'application/xml');
  if(doc.getElementsByTagName('parsererror').length)throw new Error('Fichier GPX illisible.');
  var nodes=Array.prototype.slice.call(doc.getElementsByTagNameNS('*','trkpt'));
  if(nodes.length<2)nodes=Array.prototype.slice.call(doc.getElementsByTagNameNS('*','rtept'));
  var pts=[];
  nodes.forEach(function(n){
    var lat=parseFloat(n.getAttribute('lat')),lon=parseFloat(n.getAttribute('lon'));
    if(!isFinite(lat)||!isFinite(lon))return;
    var e=n.getElementsByTagNameNS('*','ele')[0],t=n.getElementsByTagNameNS('*','time')[0];
    var ele=e?parseFloat(e.textContent):null,tm=t?Date.parse(t.textContent):null;
    pts.push({lat:lat,lon:lon,ele:isFinite(ele)?ele:null,t:isFinite(tm)?tm:null});
  });
  if(pts.length<2)throw new Error('Aucune trace trouvée dans ce fichier.');
  var d=[0],i;
  for(i=1;i<pts.length;i++)d.push(d[i-1]+hav(pts[i-1],pts[i]));
  var total=d[d.length-1];
  var withEle=pts.filter(function(p){return p.ele!=null}).length;
  var up=null,down=null,sm=null,minE=null,maxE=null;
  if(withEle>=pts.length*0.8){
    var last=null;
    var raw=pts.map(function(p){if(p.ele!=null)last=p.ele;return last});
    var first=raw.find(function(v){return v!=null});
    raw=raw.map(function(v){return v==null?first:v});
    sm=raw.map(function(_,k){var s=0,c=0;for(var j=k-2;j<=k+2;j++){if(j>=0&&j<raw.length){s+=raw[j];c++}}return s/c});
    up=0;down=0;var ref=sm[0];
    sm.forEach(function(e){if(e-ref>=3){up+=e-ref;ref=e}else if(ref-e>=3){down+=ref-e;ref=e}});
    minE=Math.min.apply(null,sm);maxE=Math.max.apply(null,sm);
  }
  var durMin=null,movMin=null,date=null;
  if(pts[0].t!=null&&pts[pts.length-1].t!=null){
    durMin=(pts[pts.length-1].t-pts[0].t)/60000;
    var mv=0;
    for(i=1;i<pts.length;i++){
      if(pts[i].t==null||pts[i-1].t==null)continue;
      var dt=(pts[i].t-pts[i-1].t)/1000;
      if(dt>0&&dt<=90&&(d[i]-d[i-1])/dt>0.25)mv+=dt;
    }
    movMin=mv>0?mv/60:durMin;
    var dd=new Date(pts[0].t);
    date=dd.getFullYear()+'-'+String(dd.getMonth()+1).padStart(2,'0')+'-'+String(dd.getDate()).padStart(2,'0');
  }
  var profile=[];
  if(sm){
    var N=90,idx=0;
    for(var k=0;k<N;k++){
      var target=total*k/(N-1);
      while(idx<d.length-1&&d[idx]<target)idx++;
      profile.push([Math.round(d[idx]/10)/100,Math.round(sm[idx])]);
    }
  }
  var track=[],NT=500,ti=0;
  for(var m=0;m<NT;m++){
    var tg=total*m/(NT-1);
    while(ti<d.length-1&&d[ti]<tg)ti++;
    track.push([Math.round(d[ti]/10)/100,sm?Math.round(sm[ti]):null,Math.round(pts[ti].lat*1e5)/1e5,Math.round(pts[ti].lon*1e5)/1e5]);
  }
  var route=[],R=140;
  for(var q=0;q<R;q++){var p=pts[Math.round(q*(pts.length-1)/(R-1))];route.push([Math.round(p.lat*1e5)/1e5,Math.round(p.lon*1e5)/1e5])}
  return {
    stats:{km:Math.round(total/10)/100,up:up==null?null:Math.round(up),down:down==null?null:Math.round(down),
      minE:minE==null?null:Math.round(minE),maxE:maxE==null?null:Math.round(maxE),
      durMin:durMin==null?null:Math.round(durMin),movMin:movMin==null?null:Math.round(movMin)},
    profile:profile,route:route,track:track,date:date
  };
}

/* ---------- bivouacs ---------- */
function effortOf(tr){
  var e=[0];
  for(var i=1;i<tr.length;i++){
    var dz=(tr[i][1]!=null&&tr[i-1][1]!=null)?tr[i][1]-tr[i-1][1]:0;
    e.push(e[i-1]+(tr[i][0]-tr[i-1][0])+Math.max(dz,0)/100);
  }
  return e;
}
function suggestNights(tr){
  var E=effortOf(tr);E=E[E.length-1];
  return Math.min(7,Math.max(1,Math.ceil(E/18)-1));
}
function findCamps(tr,nights){
  var n=tr.length,eff=effortOf(tr),E=eff[n-1],days=nights+1,step=E/days,w=step*0.3;
  var kmTot=tr[n-1][0],r=Math.max(0.25,2*kmTot/(n-1)),out=[],last=0,k,i,j;
  for(k=1;k<=nights;k++){
    var tg=step*k,best=null;
    for(i=1;i<n-1;i++){
      if(i<=last||Math.abs(eff[i]-tg)>w)continue;
      var km=tr[i][0];if(km<1||kmTot-km<1)continue;
      var sl=0,pen=0,known=tr[i][1]!=null;
      if(known){
        var lo=i,hi=i;
        while(lo>0&&km-tr[lo][0]<r)lo--;
        while(hi<n-1&&tr[hi][0]-km<r)hi++;
        var sp=tr[hi][0]-tr[lo][0],sm=0;
        for(j=lo+1;j<=hi;j++)sm+=Math.abs(tr[j][1]-tr[j-1][1]);
        sl=sp>0?sm/(sp*1000)*100:0;
        var mx=-1e9;
        for(j=0;j<n;j++){if(Math.abs(tr[j][0]-km)<=1.5&&tr[j][1]>mx)mx=tr[j][1]}
        if(tr[i][1]>=mx-20)pen+=2;
        if(tr[i][1]>2800)pen+=1.5;
      }
      var sc=sl+pen+2*Math.abs(eff[i]-tg)/w;
      if(!best||sc<best.sc)best={sc:sc,idx:i,km:km,ele:tr[i][1],lat:tr[i][2],lon:tr[i][3],slope:known?Math.round(sl*10)/10:null};
    }
    if(!best){
      i=0;while(i<n-1&&eff[i]<tg)i++;
      best={sc:0,idx:i,km:tr[i][0],ele:tr[i][1],lat:tr[i][2],lon:tr[i][3],slope:null};
    }
    last=best.idx;delete best.sc;out.push(best);
  }
  return out;
}
function daySegments(h){
  var tr=h.track,camps=h.camps||[];if(!tr||!tr.length)return [];
  var eff=effortOf(tr),E=eff[eff.length-1]||1,b=[0],segs=[],i;
  camps.forEach(function(c){b.push(c.idx)});b.push(tr.length-1);
  for(i=1;i<b.length;i++){
    var a=b[i-1],z=b[i],up=0;
    for(var j=a+1;j<=z;j++){if(tr[j][1]!=null&&tr[j-1][1]!=null&&tr[j][1]>tr[j-1][1])up+=tr[j][1]-tr[j-1][1]}
    var ef=eff[z]-eff[a],mm=h.stats&&h.stats.movMin?h.stats.movMin*ef/E:ef/4*60;
    segs.push({km:tr[z][0]-tr[a][0],up:Math.round(up),min:mm,hasEle:tr[z][1]!=null});
  }
  return segs;
}
function campFlat(sl){return sl==null?'altitude inconnue':sl<4?'très plat':sl<8?'plutôt plat':'pente notable'}
function campCard(h){
  var n=h.nights||suggestNights(h.track),out='<section class="sec" aria-labelledby="s-biv"><div class="sec-h"><h2 id="s-biv">Bivouac</h2>'+
    '<button class="chip act" data-act="tent" aria-pressed="'+(h.tent?'true':'false')+'">Je pars en tente</button></div>';
  if(!h.tent)return out+'<p class="mute small">Active « Je pars en tente » pour obtenir des emplacements de bivouac le long de la trace.</p></section>';
  var opts='';for(var q=1;q<=7;q++)opts+='<option value="'+q+'"'+(q===n?' selected':'')+'>'+q+' nuit'+(q>1?'s':'')+'</option>';
  out+='<div class="card"><div style="display:flex;gap:8px;align-items:center"><select data-act="nights" aria-label="Nombre de nuits" style="width:auto;flex:1">'+opts+'</select>'+
    '<button class="btn sm act" data-act="camp-suggest">Recalculer</button></div>'+
    '<p class="mute small" style="margin:8px 0">Chaque bivouac est placé vers la fin d\'une journée de marche (distance + 1 km par 100 m de D+), sur le passage le plus plat possible et hors crête.</p>';
  var segs=daySegments(h),camps=h.camps||[];
  segs.forEach(function(sg,k){
    out+='<div class="row" style="padding:8px 0;border-top:1px solid var(--line);justify-content:space-between"><div><b>Jour '+(k+1)+'</b></div><div class="mono small">'+fmt(sg.km,1)+' km'+(sg.hasEle?' · D+ '+fmt(sg.up,0)+' m':'')+' · ≈ '+fmtDur(sg.min)+'</div></div>';
    if(camps[k]){var c=camps[k];
      out+='<div style="padding:8px 10px;margin-bottom:4px;border-radius:8px;background:var(--paper);border:1px solid var(--line)"><b>⛺ Nuit '+(k+1)+'</b> · km '+fmt(c.km,1)+(c.ele!=null?' · '+fmt(c.ele,0)+' m':'')+
      '<div class="mute small">'+campFlat(c.slope)+(c.slope!=null?' (pente ≈ '+fmt(c.slope,0)+' %)':'')+' · '+c.lat.toFixed(4)+', '+c.lon.toFixed(4)+'</div></div>';}
  });
  out+='<div class="actions act" style="margin-top:8px"><button class="btn sm" data-act="camp-gpx"'+(camps.length?'':' disabled')+'>Télécharger les waypoints (GPX)</button></div>'+
    '<p class="mute small" style="margin-top:6px">Suggestion à vérifier sur place : point d\'eau, vent, réglementation du bivouac.</p></div></section>';
  return out;
}
function campsGpx(h){
  var x='<?xml version="1.0" encoding="UTF-8"?>\n<gpx version="1.1" creator="Gramme" xmlns="http://www.topografix.com/GPX/1/1">\n';

    x+='<wpt lat="'+c.lat+'" lon="'+c.lon+'">'+(c.ele!=null?'<ele>'+c.ele+'</ele>':'')+'<name>Bivouac nuit '+(k+1)+'</name><sym>Campground</sym></wpt>\n';

/* ---------- dessins ---------- */
function routeSvg(route,camps){
  if(!route||route.length<2)return '';
  var W=320,H=190,P=14,la=route.map(function(p){return p[0]}),lo=route.map(function(p){return p[1]});
  var minLa=Math.min.apply(null,la),maxLa=Math.max.apply(null,la),minLo=Math.min.apply(null,lo),maxLo=Math.max.apply(null,lo);
  var k=Math.cos(((minLa+maxLa)/2)*Math.PI/180);
  var w=Math.max((maxLo-minLo)*k,1e-6),h=Math.max(maxLa-minLa,1e-6);
  var s=Math.min((W-2*P)/w,(H-2*P)/h),ox=(W-w*s)/2,oy=(H-h*s)/2;
  var pts=route.map(function(p){return (ox+(p[1]-minLo)*k*s).toFixed(1)+','+(oy+(maxLa-p[0])*s).toFixed(1)});
  var a=pts[0].split(','),z=pts[pts.length-1].split(',');
  var grid='';for(var x=40;x<W;x+=40)grid+='<line x1="'+x+'" y1="0" x2="'+x+'" y2="'+H+'" stroke="var(--line)" stroke-width="1"/>';
  for(var y=38;y<H;y+=38)grid+='<line x1="0" y1="'+y+'" x2="'+W+'" y2="'+y+'" stroke="var(--line)" stroke-width="1"/>';
  return '<svg class="viz" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Tracé de la randonnée vu du dessus">'+grid+
    '<polyline points="'+pts.join(' ')+'" fill="none" stroke="var(--sig)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>'+
    '<circle cx="'+a[0]+'" cy="'+a[1]+'" r="5" fill="var(--card)" stroke="var(--ink)" stroke-width="2"/>'+
    '<circle cx="'+z[0]+'" cy="'+z[1]+'" r="5" fill="var(--acc)" stroke="var(--ink)" stroke-width="2"/>'+
    (camps||[]).map(function(c,j){return '<circle cx="'+(ox+(c.lon-minLo)*k*s).toFixed(1)+'" cy="'+(oy+(maxLa-c.lat)*s).toFixed(1)+'" r="9" fill="var(--acc)" stroke="var(--ink)" stroke-width="2"/><text x="'+(ox+(c.lon-minLo)*k*s).toFixed(1)+'" y="'+(oy+(maxLa-c.lat)*s+4).toFixed(1)+'" text-anchor="middle" font-size="11" font-weight="700" fill="var(--on-acc)">'+(j+1)+'</text>'}).join('')+'</svg>';
}
function profileSvg(pr,camps){
  if(!pr||pr.length<2)return '';
  var W=320,H=120,L=48,R=8,T=10,B=20;
  var es=pr.map(function(p){return p[1]}),mn=Math.min.apply(null,es),mx=Math.max.apply(null,es);

  var area=line+' L'+X(km).toFixed(1)+' '+(H-B)+' L'+X(0).toFixed(1)+' '+(H-B)+' Z';
  return '<svg class="viz" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Profil d\'altitude de '+fmt(mn,0)+' à '+fmt(mx,0)+' mètres">'+

    '<text x="'+(L-4)+'" y="'+(Y(mx)+4)+'" text-anchor="end">'+fmt(mx,0)+' m</text>'+
    '<text x="'+(L-4)+'" y="'+(H-B+4)+'" text-anchor="end">'+fmt(mn,0)+' m</text>'+
    (camps||[]).filter(function(c){return c.ele!=null}).map(function(c,j){return '<circle cx="'+X(c.km).toFixed(1)+'" cy="'+Y(Math.min(mx,Math.max(mn,c.ele))).toFixed(1)+'" r="8" fill="var(--acc)" stroke="var(--ink)" stroke-width="2"/><text x="'+X(c.km).toFixed(1)+'" y="'+(Y(Math.min(mx,Math.max(mn,c.ele)))+4).toFixed(1)+'" text-anchor="middle" font-size="10" font-weight="700" fill="var(--on-acc)">'+(j+1)+'</text>'}).join('')+
    '<text x="'+L+'" y="'+(H-4)+'">0 km</text><text x="'+(W-R)+'" y="'+(H-4)+'" text-anchor="end">'+fmt(km,1)+' km</text></svg>';

  out+='<section class="sec" aria-labelledby="s-ch"><div class="sec-h"><h2 id="s-ch">Charge moyenne par sac</h2></div>';
  if(!rows.length)out+='<div class="card mute">Ajoute du matériel à une sortie pour comparer le poids des sacs.</div>';
  else{
    var mx=Math.max.apply(null,rows.map(function(r){return r.avg}));
    out+='<div class="card bars">'+rows.map(function(r){
      var s=r.h.stats;
      return '<div class="b"><div><a href="#sortie-'+esc(r.h.id)+'" style="text-decoration:none"><b>'+esc(r.h.name)+'</b></a><div class="mute small">'+esc(fmtDate(r.h.date))+(s?' · '+fmt(s.km,1)+' km'+(s.up!=null?' · D+ '+fmt(s.up,0)+' m':''):'')+'</div></div>'+

    }).join('')+'</div>';
  }
  out+='</section>';

function shareSheet(hid){

  if(h.stats)L.push(fmt(h.stats.km,1)+' km'+(h.stats.up!=null?', D+ '+fmt(h.stats.up,0)+' m':''));
  function block(title,list,b){
    L.push('');L.push(title+' : '+fmtW(b.pack)+' (base '+fmtW(b.base)+', consommables '+fmtW(b.conso)+')');
    CATS.forEach(function(cat){
      var g=list.filter(function(i){return (CATS.indexOf(i.cat)<0?'Divers':i.cat)===cat});
      if(!g.length)return;L.push('  '+cat);
      g.forEach(function(i){L.push('   - '+i.name+((i.qty||1)>1?' ×'+i.qty:'')+' : '+fmtW((i.g||0)*(i.qty||1))+(i.kind==='worn'?' (sur soi)':''))});
    });
  }
  h.people.forEach(function(p){block(p.name,h.items.filter(function(i){return i.who===p.id}),c.per[p.id])});
  var rest=h.items.filter(function(i){return !i.who||!c.per[i.who]});
  if(rest.length)block('À répartir',rest,c.none);

document.addEventListener('click',function(e){
  var t=e.target.closest('[data-act]');if(!t)return;
  var a=t.dataset.act,id=t.dataset.id,hid=currentHikeId();
  if(a==='pack'||a==='who')return; /* gérés par change */
  switch(a){
    case 'close':closeSheet();break;
    case 'account':accountSheet();break;
    case 'signout':signOut();break;
    case 'new-hike':hikeSheet(null);break;
    case 'edit-hike':hikeSheet(hid);break;
    case 'new-person':personSheet(hid,null);break;
    case 'edit-person':personSheet(hid,id);break;
    case 'edit-item':itemSheet(hid,id);break;
    case 'pick':pickSheet(hid,route().name==='sac'?route().id:null);break;
    case 'pick-add':if(pickCtx&&pickCtx.bagId)addToBag(pickCtx.bagId,id);else addPickItem(pickCtx.hikeId,id);break;
    case 'pick-add-all':
      if(!pickCtx||!pickCtx.bagId)break;
      var pq=pickCtx.q.trim().toLowerCase(),pb=pickCtx.bagId;
      mutateBag(pb,function(b){Object.keys(state.gear).forEach(function(k){var g=state.gear[k];
        if(pq&&g.name.toLowerCase().indexOf(pq)<0&&g.cat.toLowerCase().indexOf(pq)<0)return;
        if(!b.items.some(function(i){return i.gid===g.id}))b.items.push({gid:g.id,qty:1})})});
      break;
    case 'pick-new':gearSheet(null,pickCtx&&pickCtx.hikeId,pickCtx&&pickCtx.bagId);break;
    case 'bag-new':bagSheet(null);break;
    case 'bag-edit':bagSheet(route().id);break;
    case 'bag-dup':
      var sb0=state.bags[route().id];if(!sb0)break;
      var nb2={id:'bag-'+uid(),name:sb0.name+' (copie)',note:sb0.note||'',items:structuredClone(sb0.items||[]),owner:meMail()};
      state.bags[nb2.id]=nb2;saveBag(nb2);location.hash='sac-'+nb2.id;render();break;
    case 'bag-qty':
      var dq=parseInt(t.dataset.d,10);
      mutateBag(route().id,function(b){b.items.forEach(function(i){if(i.gid===id)i.qty=Math.max(1,(i.qty||1)+dq)})});break;
    case 'bag-rm':mutateBag(route().id,function(b){b.items=b.items.filter(function(i){return i.gid!==id})});break;
    case 'load-bag':loadBagSheet(hid,id);break;
    case 'load-bag-do':
      var lb=state.bags[id],lp=t.dataset.p;if(!lb)break;
      closeSheet();
      mutateHike(hid,function(h){
        (lb.items||[]).forEach(function(it){
          var g=state.gear[it.gid];if(!g)return;
          var ex=h.items.filter(function(x){return x.gearId===g.id&&x.who===lp})[0];
          if(ex)ex.qty=(ex.qty||1)+(it.qty||1);
          else h.items.push({id:uid(),gearId:g.id,name:g.name,cat:g.cat,g:g.g,qty:it.qty||1,kind:g.kind,who:lp,packed:false});
        });
      },['items']);
      toast('Sac « '+lb.name+' » ajouté.');break;
    case 'share':shareSheet(hid);break;
    case 'invite':inviteSheet(hid);break;
    case 'invite-link':mutateHike(hid,function(h){h.joinToken=randTok()},['joinToken']);inviteSheet(hid);break;
    case 'invite-off':mutateHike(hid,function(h){h.joinToken=null},['joinToken']);inviteSheet(hid);break;
    case 'invite-copy':
      var lk=$('#inv-link');if(!lk)break;
      if(navigator.share){navigator.share({title:'Gramme',text:'Rejoins ma sortie sur Gramme',url:lk.value}).catch(function(){})}
      else if(navigator.clipboard)navigator.clipboard.writeText(lk.value).then(function(){toast('Lien copié.')},function(){lk.select();toast('Sélectionne le lien et copie-le.')});
      else{lk.select();toast('Sélectionne le lien et copie-le.')}
      break;
    case 'member-del':
      mutateHike(hid,function(h){h.members=(h.members||[]).filter(function(m){return m!==id});h.people.forEach(function(p){if(p.email===id)p.email=null})},['members','people']);
      inviteSheet(hid);break;
    case 'leave':
      sb.rpc('leave_hike',{hid:hid}).then(function(r){
        if(r.error){toast(errMsg(r.error));return}
        delete state.hikes[hid];saveCache();closeSheet();location.hash='sorties';render();toast('Tu as quitté la sortie.');
      });break;
    case 'join-all':
      var vv=t.dataset.val==='1';document.querySelectorAll('#j-list input[type=checkbox]').forEach(function(c){c.checked=vv});
      t.dataset.val=vv?'0':'1';t.textContent=vv?'Tout décocher':'Tout cocher';break;
    case 'tent':
      mutateHike(hid,function(h){
        h.tent=!h.tent;
        if(h.tent&&h.track){h.nights=h.nights||suggestNights(h.track);h.camps=findCamps(h.track,h.nights)}else h.camps=[];
      },['tent','nights','camps']);break;
    case 'camp-suggest':
      mutateHike(hid,function(h){h.nights=h.nights||suggestNights(h.track);h.camps=findCamps(h.track,h.nights)},['nights','camps']);
      toast('Bivouacs recalculés.');break;
    case 'camp-gpx':
      var hh=state.hikes[hid];if(!hh||!(hh.camps||[]).length)break;
      var url=URL.createObjectURL(new Blob([campsGpx(hh)],{type:'application/gpx+xml'})),an=document.createElement('a');
      an.href=url;an.download=(hh.name||'rando').replace(/[^\w-]+/g,'-')+'-bivouacs.gpx';document.body.appendChild(an);an.click();an.remove();
      setTimeout(function(){URL.revokeObjectURL(url)},3000);break;
    case 'gear-new':gearSheet(null,null);break;
    case 'gear-edit':gearSheet(id,null);break;
    case 'seed':seedGear();break;
    case 'filter':state.filter=id;render();break;
    case 'check-all':
      var scope=t.dataset.scope,val=t.dataset.val==='1';
      mutateHike(hid,function(h){h.items.forEach(function(i){
        if(!visible(h,i))return;
        var cat=CATS.indexOf(i.cat)<0?'Divers':i.cat;
        if(scope==='*'||scope===cat)i.packed=val;
      })},['items']);break;
    case 'balance':
      mutateHike(hid,function(h){
        var miss=h.people.filter(function(p){return !p.kg});
        if(!balance(h,false)){toast('Rien à répartir : tout est déjà attribué.');return}
        if(!miss.length)toast('Répartition faite selon le poids du corps.');
        else if(miss.length===h.people.length)toast('Poids du corps non renseigné : parts égales entre les sacs.');
        else toast('Poids du corps manquant pour '+miss.map(function(p){return p.name}).join(', ')+' : poids moyen utilisé.');
      },['items']);break;
    case 'reset-assign':
      mutateHike(hid,function(h){h.items.forEach(function(i){if(i.kind!=='worn')i.who=''})},['items']);break;
    case 'copy-share':
      var ta=$('#shareTxt');
      if(navigator.clipboard&&navigator.clipboard.writeText){
        navigator.clipboard.writeText(ta.value).then(function(){toast('Liste copiée.')},function(){ta.select();toast('Sélectionne le texte et copie-le.')});
      }else{ta.select();toast('Sélectionne le texte et copie-le.')}
      break;
    case 'del-hike':case 'del-person':case 'del-item':case 'del-gear':case 'del-bag':
      if(!t.dataset.armed){
        t.dataset.armed='1';t.textContent=t.dataset.arm||'Confirmer la suppression';
        setTimeout(function(){if(t.isConnected&&!t.dataset.arm===false){t.dataset.armed='';t.textContent=t.dataset.arm==='Retirer ?'?'×':'Supprimer'}},4000);
        break;
      }
      if(a==='del-hike'){
        enqueue('hikes/'+id,function(){return db.doc('hikes/'+id).delete()});
        delete state.hikes[id];closeSheet();location.hash='sorties';render();
      }else if(a==='del-bag'){
        enqueue('gear/'+id,function(){return db.doc('gear/'+id).delete()});
        delete state.bags[id];closeSheet();location.hash='sacs';render();
      }else if(a==='del-gear'){
        enqueue('gear/'+id,function(){return db.doc('gear/'+id).delete()});
        delete state.gear[id];closeSheet();render();
      }else if(a==='del-person'){
        closeSheet();mutateHike(hid,function(h){h.people=h.people.filter(function(p){return p.id!==id});h.items.forEach(function(i){if(i.who===id)i.who=''})},['people','items']);
        if(state.filter===id)state.filter='all';
      }else{
        closeSheet();mutateHike(hid,function(h){h.items=h.items.filter(function(i){return i.id!==id})},['items']);
      }
      break;
  }
});
document.addEventListener('change',function(e){
  var t=e.target,hid=currentHikeId();
  if(t.id==='gpxIn'){importGpx(t);return}
  if(!t.dataset||!t.dataset.act)return;
  if(t.dataset.act==='pack'){var v=t.checked;mutateHike(hid,function(h){h.items.forEach(function(i){if(i.id===t.dataset.id)i.packed=v})},['items'])}
  if(t.dataset.act==='join-bag'){var jbb=state.bags[t.value];if(jbb){var set={};(jbb.items||[]).forEach(function(i){set[i.gid]=1});document.querySelectorAll('#j-list input[type=checkbox]').forEach(function(c){c.checked=!!set[c.value]})}return}
  if(t.dataset.act==='nights'){var nv=parseInt(t.value,10);mutateHike(hid,function(h){h.nights=nv;h.camps=findCamps(h.track,nv)},['nights','camps'])}
  if(t.dataset.act==='who'){var w=t.value;mutateHike(hid,function(h){h.items.forEach(function(i){if(i.id===t.dataset.id)i.who=w})},['items'])}
});
document.addEventListener('input',function(e){
  var t=e.target;
  if(t.id==='q'){state.q=t.value;var l=$('#gearList');if(l)l.innerHTML=gearListHtml()}
  if(t.id==='pq'&&pickCtx){pickCtx.q=t.value;refreshPick()}
});
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeSheet()});
document.addEventListener('submit',function(e){
  var f=e.target;if(!f.dataset||!f.dataset.form)return;
  e.preventDefault();
  var d=new FormData(f),kind=f.dataset.form,id=f.dataset.id,hid=f.dataset.hike,bid=f.dataset.bag;
  if(kind==='login'){
    var sub=e.submitter&&e.submitter.value;
    doAuth(sub==='signup'?'signup':'signin',String(d.get('email')).trim(),String(d.get('password')));return;
  }
  if(!db){toast('Connexion nécessaire pour modifier.');return}
  if(kind==='hike'){
    var name=String(d.get('name')).trim();if(!name)return;
    var tp=num(d.get('target'));tp=tp?Math.min(50,Math.max(5,Math.round(tp))):20;
    if(id){
      closeSheet();
      mutateHike(id,function(h){h.name=name;h.date=String(d.get('date'));h.place=String(d.get('place')).trim();h.notes=String(d.get('notes')).trim();h.targetPct=tp},['name','date','place','notes','targetPct']);
    }else{
      var nid=uid(),doc={name:name,date:String(d.get('date')),place:String(d.get('place')).trim(),notes:String(d.get('notes')).trim(),targetPct:tp,stats:null,profile:[],route:[],people:[],items:[],owner:meMail(),members:[],joinToken:null,createdAt:Date.now()};
      var src=state.hikes[d.get('copy')];
      if(src){
        var map={};
        src.people.forEach(function(p){var np={id:uid(),name:p.name,kg:p.kg||null,email:p.email||null};map[p.id]=np.id;doc.people.push(np)});
        src.items.forEach(function(i){var c=Object.assign({},i);c.id=uid();c.packed=false;c.who=map[i.who]||'';doc.items.push(c)});
      }
      String(d.get('people')||'').split(',').map(function(s){return s.trim()}).filter(Boolean).slice(0,12).forEach(function(n){
        if(!doc.people.some(function(p){return p.name.toLowerCase()===n.toLowerCase()}))doc.people.push({id:uid(),name:n.slice(0,40),kg:null});
      });
      state.hikes[nid]=Object.assign({id:nid},doc);
      enqueue('hikes/'+nid,function(){return db.doc('hikes/'+nid).set(doc)});
      closeSheet();location.hash='sortie-'+nid;render();
    }
  }else if(kind==='bag'){
    var bn=String(d.get('name')).trim();if(!bn)return;var bnote=String(d.get('note')).trim();
    closeSheet();
    if(id){mutateBag(id,function(b){b.name=bn;b.note=bnote})}
    else{var nb={id:'bag-'+uid(),name:bn,note:bnote,items:[],owner:meMail()};state.bags[nb.id]=nb;saveBag(nb);location.hash='sac-'+nb.id;render()}
  }else if(kind==='join'){
    var jn=String(d.get('name')).trim();if(!jn)return;var jkg=num(d.get('kg')),gids=d.getAll('gear'),jm=meMail(),jb=state.bags[d.get('bag')],jq={};
    if(jb)(jb.items||[]).forEach(function(it){jq[it.gid]=it.qty||1});
    closeSheet();
    mutateHike(hid,function(h){
      if(h.people.some(function(p){return p.email===jm}))return;
      var pid=uid();h.people.push({id:pid,name:jn.slice(0,40),kg:jkg,email:jm});
      gids.forEach(function(gid){var g=state.gear[gid];if(g)h.items.push({id:uid(),gearId:g.id,name:g.name,cat:g.cat,g:g.g,qty:jq[gid]||1,kind:g.kind,who:pid,packed:false})});
    },['people','items']);
    toast('Tu as rejoint la sortie.');
  }else if(kind==='person'){
    var pn=String(d.get('name')).trim();if(!pn)return;var kg=num(d.get('kg'));
    closeSheet();
    var me=d.get('me')==='1',myMail=meMail();
    mutateHike(hid,function(h){
      if(me)h.people.forEach(function(p){if(p.email===myMail)p.email=null});
      if(id){h.people.forEach(function(p){if(p.id===id){p.name=pn;p.kg=kg;if(me)p.email=myMail;else if(p.email===myMail)p.email=null}})}
      else h.people.push({id:uid(),name:pn,kg:kg,email:me?myMail:null});
    },['people']);
  }else if(kind==='gear'){
    var gname=String(d.get('name')).trim(),gw=num(d.get('g'));if(!gname||gw==null)return;
    var g={id:id||uid(),name:gname,g:gw,cat:String(d.get('cat')),kind:String(d.get('kind')),owner:(id&&state.gear[id]&&state.gear[id].owner)||meMail()};
    state.gear[g.id]=g;saveGear(g);
    if(bid&&!id){closeSheet();pickCtx=null;addToBag(bid,g.id);toast('Ajouté au sac et à l\'inventaire.')}
    else if(hid&&!id){closeSheet();pickCtx=null;addPickItem(hid,g.id);toast('Ajouté à la sortie et à l\'inventaire.')}
    else{
      closeSheet();render();
      if(id)toast('Inventaire mis à jour. Les sorties déjà composées gardent leur poids.');
    }
    refreshPick();
  }else if(kind==='item'){
    var ig=num(d.get('g')),iq=Math.max(1,Math.round(num(d.get('qty'))||1)),iw=String(d.get('who'));
    if(ig==null)return;
    closeSheet();
    mutateHike(hid,function(h){h.items.forEach(function(i){if(i.id===id){i.g=ig;i.qty=iq;i.who=iw}})},['items']);
  }
});
function importGpx(input){
  var file=input.files&&input.files[0],hid=currentHikeId();if(!file||!hid)return;
  if(file.size>25*1024*1024){toast('Fichier trop volumineux (25 Mo maximum).');input.value='';return}
  file.text().then(function(txt){
    var r=parseGpx(txt);
    mutateHike(hid,function(h){
      h.stats=r.stats;h.profile=r.profile;h.route=r.route;h.track=r.track;
      if(h.tent){h.nights=h.nights||suggestNights(r.track);h.camps=findCamps(r.track,h.nights)}else h.camps=[];
      if(r.date)h.date=r.date;
    },['stats','profile','route','track','camps','nights','date']);
    toast('Trace importée : '+fmt(r.stats.km,1)+' km'+(r.stats.up!=null?', D+ '+fmt(r.stats.up,0)+' m':'')+'.');
  }).catch(function(err){toast(err&&err.message?err.message:'Ce fichier n\'a pas pu être lu.')});
  input.value='';
}

/* ---------- données (Supabase) ---------- */
var CFG=window.GRAMME_CONFIG||{};
var sb=null,subscribed=false,unsubs=[],userEmail='';
var CACHE_KEY='gramme-cache-v1';

function makeDb(client){
  return {
    collection:function(c){
      return {onSnapshot:function(next,err){
        var rows={},dead=false;
        function emit(){next({docs:Object.keys(rows).map(function(id){return {id:id,data:function(){return rows[id]}}})})}
        client.from(c).select('id,data').then(function(r){
          if(dead)return;
          if(r.error){if(err)err(r.error);return}
          (r.data||[]).forEach(function(x){rows[x.id]=x.data});emit();
        },function(e){if(err&&!dead)err(e)});
        var ch=client.channel('rt-'+c).on('postgres_changes',{event:'*',schema:'public',table:c},function(p){
          if(p.eventType==='DELETE'){if(p.old)delete rows[p.old.id]}
          else if(p.new){rows[p.new.id]=p.new.data}
          emit();
        }).subscribe();
        return function(){dead=true;client.removeChannel(ch)};
      }};
    },
    doc:function(path){
      var parts=path.split('/'),c=parts[0],id=parts[1];
      function chk(r){if(r&&r.error)throw r.error}
      return {
        set:function(d){return client.from(c).upsert({id:id,data:d,updated_at:new Date().toISOString()}).then(chk)},
        update:function(d){return client.rpc('merge_doc',{tbl:c,doc_id:id,patch:d}).then(chk)},
        delete:function(){return client.from(c).delete().eq('id',id).then(chk)}
      };
    }
  };
}
function loadCache(){
  try{var c=JSON.parse(localStorage.getItem(CACHE_KEY)||'null');
    if(c){state.gear=c.gear||{};state.bags=c.bags||{};state.hikes=c.hikes||{};state.ready.gear=true;state.ready.hikes=true;return true}}catch(e){}
  return false;
}
function saveCache(){try{localStorage.setItem(CACHE_KEY,JSON.stringify({gear:state.gear,bags:state.bags,hikes:state.hikes}))}catch(e){}}
var slowT=null;
function ready(k){state.ready[k]=true;if(state.ready.gear&&state.ready.hikes)clearTimeout(slowT)}
function subscribe(){
  if(subscribed)return;subscribed=true;
  clearTimeout(slowT);slowT=setTimeout(function(){state.slow=true;render()},10000);
  unsubs.push(db.collection('gear').onSnapshot(function(snap){
    var m={},bg={};snap.docs.forEach(function(x){var v=x.data();if(!v)return;var o=Object.assign({id:x.id},v);if(v.type==='bag'){o.items=o.items||[];bg[x.id]=o}else m[x.id]=o});
    state.gear=m;state.bags=bg;ready('gear');saveCache();scheduleRender();
  },function(){ready('gear');scheduleRender()}));
  unsubs.push(db.collection('hikes').onSnapshot(function(snap){
    var m={};snap.docs.forEach(function(x){
      var v=x.data();if(!v)return;
      if(inflight['hikes/'+x.id]&&state.hikes[x.id]){m[x.id]=state.hikes[x.id];return}
      var o=Object.assign({id:x.id},v);o.people=o.people||[];o.items=o.items||[];m[x.id]=o;
    });
    state.hikes=m;ready('hikes');saveCache();scheduleRender();
    if(state.joinHike&&m[state.joinHike]){
      var jid=state.joinHike;state.joinHike=null;
      if(!m[jid].people.some(function(p){return p.email&&p.email===meMail()}))setTimeout(function(){joinSheet(jid)},80);
    }
  },function(){ready('hikes');scheduleRender()}));
}
function teardown(){
  unsubs.forEach(function(u){try{u()}catch(e){}});unsubs=[];subscribed=false;
  state.gear={};state.bags={};state.hikes={};state.ready={gear:false,hikes:false};state.slow=false;
  try{localStorage.removeItem(CACHE_KEY)}catch(e){}
}
var JOIN_KEY='gramme-join';
function pendingJoin(){try{return JSON.parse(localStorage.getItem(JOIN_KEY)||'null')}catch(e){return null}}
function capturePending(){
  var m=/^#rejoindre-([A-Za-z0-9]+)\.([a-f0-9]{8,64})$/.exec(location.hash||'');
  if(!m)return false;
  try{localStorage.setItem(JOIN_KEY,JSON.stringify({id:m[1],tok:m[2]}))}catch(e){}
  try{history.replaceState(null,'',location.pathname+location.search)}catch(e){location.hash=''}
  return true;
}
function tryJoin(){
  var pj=pendingJoin();if(!pj||!sb)return Promise.resolve(false);
  return sb.rpc('join_hike',{hid:pj.id,tok:pj.tok}).then(function(r){
    try{localStorage.removeItem(JOIN_KEY)}catch(e){}
    if(r.error){toast('Invitation invalide ou désactivée.');return false}
    state.joinHike=pj.id;return true;
  },function(){toast('Connexion impossible : l\'invitation sera retentée plus tard.');return false});
}
function resubscribe(){
  unsubs.forEach(function(u){try{u()}catch(e){}});unsubs=[];subscribed=false;
  state.ready={gear:false,hikes:false};subscribe();render();
}
function joinNow(){tryJoin().then(function(ok){if(ok){location.hash='sortie-'+state.joinHike;resubscribe()}})}
function enter(sess){
  userEmail=(sess&&sess.user&&sess.user.email)||'';
  state.auth='in';loadCache();render();
  (pendingJoin()?tryJoin():Promise.resolve(false)).then(function(ok){
    if(ok)location.hash='sortie-'+state.joinHike;
    subscribe();
    sb.rpc('is_allowed').then(function(r){
      if(!r.error&&r.data===false){state.auth='denied';teardown();render()}
    },function(){});
  });
}
function doAuth(mode,email,password){
  if(!email||password.length<8){toast('Saisis ton e-mail et un mot de passe de 8 caractères minimum.');return}
  state.loginEmail=email;
  var redirect=location.origin+location.pathname;
  var p=mode==='signup'
    ?sb.auth.signUp({email:email,password:password,options:{emailRedirectTo:redirect}})
    :sb.auth.signInWithPassword({email:email,password:password});
  p.then(function(r){
    if(r.error){
      var m=String(r.error.message||'');
      if(/confirm/i.test(m))toast('Confirme d\'abord ton adresse avec le lien reçu par e-mail.');
      else if(/invalid login/i.test(m))toast('E-mail ou mot de passe incorrect. Première visite ? Choisis « Créer mon compte ».');
      else if(/already|registered/i.test(m))toast('Ce compte existe déjà : utilise « Se connecter ».');
      else if(/rate|seconds|limit/i.test(m))toast('Trop de demandes : attends quelques minutes avant de réessayer.');
      else if(/password/i.test(m))toast('Mot de passe refusé : choisis-en un plus long ou moins courant.');
      else toast('Connexion impossible : '+m);
      return;
    }
    if(r.data&&r.data.session){enter(r.data.session);return}
    state.signupDone=true;render();
  },function(){toast('Connexion impossible : vérifie ta connexion internet.')});
}
function signOut(){
  closeSheet();
  sb.auth.signOut().then(function(){},function(){}).then(function(){
    teardown();state.auth='out';state.signupDone=false;render();
  });
}
function accountSheet(){
  openSheet('Compte','<div class="form"><p>Connecté avec <b>'+esc(userEmail)+'</b></p>'+
    '<p class="mute small">Pour inviter un ami, ajoute son adresse e-mail dans la table allowed_emails de Supabase (voir le README).</p>'+
    '<div class="actions"><button class="btn danger grow" data-act="signout">Se déconnecter</button></div></div>',false);
}

/* ---------- démarrage ---------- */
window.addEventListener('hashchange',function(){var c=capturePending();if(c&&state.auth==='in'){joinNow();return}closeSheet();render();window.scrollTo(0,0)});
window.addEventListener('online',function(){render()});
window.addEventListener('offline',function(){render()});
function boot(){
  if(!CFG.supabaseUrl||!CFG.supabaseKey||!window.supabase){state.auth='setup';render();return}
  sb=window.supabase.createClient(CFG.supabaseUrl,CFG.supabaseKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
  db=makeDb(sb);
  sb.auth.onAuthStateChange(function(ev){
    if(ev==='SIGNED_OUT'&&state.auth==='in'){teardown();state.auth='out';render()}
  });
  sb.auth.getSession().then(function(r){
    var sess=r&&r.data&&r.data.session;
    if(sess)enter(sess);else{state.auth='out';render()}
  },function(){state.auth='out';render()});
}
capturePending();
render();
boot();
if('serviceWorker' in navigator&&/^https?:/.test(location.protocol)){
  window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})});
}
})();
</script>
